name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check
        run: python -m py_compile rss-tray.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
