name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-gi gir1.2-gtk-3.0 python3-gi-cairo python3-cairo python3-feedparser
      - name: Syntax check
        run: /usr/bin/python3 -m py_compile rss-tray.py
      - name: Tests
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
